name: plant_scan
description: Point your camera at a plant, find out what it is, and keep a care log.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.6.0  # Flutter 3.27 or newer (Color.withValues)

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0
  image_picker: ^1.1.2
  http: ^1.2.2
  path_provider: ^2.1.4
  path: ^1.9.0
  intl: ^0.19.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
